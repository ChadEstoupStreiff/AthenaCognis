services:
  back_db:
    image: mariadb:10.6
    container_name: back_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: superdiary
    volumes:
      - ${DATA_PATH}/back/db:/var/lib/mysql
      - ${LOCAL_PATH}:/local:ro
    hostname: back_db
    networks:
      - appnet

  pma:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pma
    restart: unless-stopped
    environment:
      PMA_HOST: back_db
      PMA_USER: root
      PMA_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${PMA_PORT}:80"
    hostname: pma
    networks:
      - appnet
    
  
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=1h
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ${DATA_PATH}/ollama:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4.'
          # memory: '4.'
    tty: true
    hostname: ollama
    networks:
      - appnet

  grobid:
    image: grobid/grobid:0.9.1-crf
    container_name: grobid
    restart: unless-stopped
    init: true
    ulimits:
      core: 0
    hostname: grobid
    environment:
      # No -Xmx = JVM takes 25% of host RAM. Cap heap; SerialGC hands freed heap back to OS.
      JAVA_OPTS: "-Xms256m -Xmx2g -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30"
    deploy:
      resources:
        limits:
          memory: 3g
    networks:
      - appnet

  back:
    build: ./back
    container_name: back
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [ gpu ]
    deploy:
      resources:
        limits:
          cpus: '4.'
          # memory: '4.'
    volumes:
      - ${DATA_PATH}/shared:/shared
      - .env:/.env
      # LLM prompts, re-read on change.
      - ./prompts.yaml:/prompts.yaml:ro
      - ${DATA_PATH}/whisper_cache:/root/.cache
      - ${DATA_PATH}/paddle:/root/.paddle
      - ${DATA_PATH}/paddleocr:/root/.paddleocr
      - ${DATA_PATH}/ollama:/ollama
      - ${DATA_PATH}/back/db:/mysql
      # Local file changes data source (folders picked on the Activity page).
      - ${LOCAL_PATH}:/local:ro
    depends_on:
      - back_db
    ports:
      - "${BACK_PORT}:80"
    hostname: back
    # Reach host services (ActivityWatch) on Linux too; built in on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - appnet

  front:
    build: ./front
    container_name: front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8401}:80"
    volumes:
      - ${DATA_PATH}/shared:/shared:ro
    hostname: front
    networks:
      - appnet

networks:
  appnet:
    driver: bridge