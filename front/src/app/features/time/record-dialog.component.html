@let state = form();
<p-dialog
  [header]="record() ? 'Edit time entry' : 'Log time'"
  [modal]="true"
  appendTo="body"
  [(visible)]="visible"
  [style]="{ width: 'min(640px, 98vw)' }"
  [dismissableMask]="true"
>
  <form class="grid" (ngSubmit)="save()">
    <label class="field wide">
      <span>Title</span>
      <input
        pInputText
        name="title"
        [ngModel]="state.title"
        (ngModelChange)="patch({ title: $event })"
        required
      />
    </label>
    <label class="field">
      <span>Project</span>
      <p-select
        name="project"
        [options]="projectOptions()"
        [ngModel]="state.project"
        (ngModelChange)="patch({ project: $event })"
        [filter]="true"
        placeholder="Choose…"
        [fluid]="true"
        appendTo="body"
      >
        <ng-template #item let-name><ac-tag-chip [name]="name" kind="project" /></ng-template>
      </p-select>
    </label>
    <label class="field">
      <span>Hours</span>
      <p-inputnumber
        name="hours"
        [ngModel]="state.hours"
        (ngModelChange)="patch({ hours: $event ?? 0 })"
        [min]="0"
        [max]="24"
        [step]="0.25"
        [showButtons]="true"
        mode="decimal"
        [maxFractionDigits]="2"
        [fluid]="true"
      />
    </label>
    <label class="field">
      <span>Date</span>
      <p-datepicker
        name="date"
        [ngModel]="state.date"
        (ngModelChange)="patch({ date: $event })"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        [fluid]="true"
        appendTo="body"
      />
    </label>
    <label class="field">
      <span>Start time</span>
      <p-datepicker
        name="start"
        [ngModel]="state.start"
        (ngModelChange)="patch({ start: $event })"
        [timeOnly]="true"
        [stepMinute]="15"
        [showClear]="true"
        [disabled]="record() !== null && !dateChanged()"
        [fluid]="true"
        appendTo="body"
      />
    </label>
    @if (dateChanged()) {
      <p class="hint wide">
        Changing the date re-creates this entry (the backend cannot move entries).
      </p>
    }
    <div class="field wide">
      <span>Description</span>
      <ac-ai-textarea
        [value]="state.description"
        (valueChange)="patch({ description: $event })"
        [rows]="3"
        context="This is the description of a work session."
      />
    </div>
    <label class="field">
      <span>Location</span>
      <input
        pInputText
        name="location"
        [ngModel]="state.location"
        (ngModelChange)="patch({ location: $event })"
      />
    </label>
    <label class="field">
      <span>Attendees</span>
      <input
        pInputText
        name="attendees"
        [ngModel]="state.attendees"
        (ngModelChange)="patch({ attendees: $event })"
        placeholder="Free text"
      />
    </label>
    <label class="field wide">
      <span>People</span>
      <p-multiselect
        name="contacts"
        [options]="contactOptions()"
        [ngModel]="state.contacts"
        (ngModelChange)="patch({ contacts: $event })"
        [filter]="true"
        [autofocusFilter]="true"
        display="chip"
        placeholder="Nobody"
        [fluid]="true"
        appendTo="body"
      />
    </label>
  </form>

  <ng-template #footer>
    @if (record()) {
      <p-button
        class="delete"
        label="Delete"
        icon="pi pi-trash"
        severity="danger"
        [text]="true"
        (onClick)="remove()"
      />
    }
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
    <p-button label="Save" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
  </ng-template>
</p-dialog>
