# Every prompt sent to an LLM by the backend.
#
# Placeholders: {name} is replaced by the backend at request time (listed above each prompt).
# Any other brace text (JSON examples like {"title": "..."}) is sent as written: no escaping needed.
# {input} is filled last by the LLM call itself with the file content.
# The file is re-read when it changes: edits apply without restarting the backend.

# Answer-style rule put before every text and chat request.
# Default of Settings → AI → style instruction (only until the setting is saved once).
style:
  default_instruction: |-
    Don't be too verbose: no preamble, no filler, no repetition. Answer only what is asked.

# Assistant chat (multi-turn, files and calendar events attached).
chat:
  system: |
    You are given a conversation and some files and calendar events provided by the user.
    You are an AI Chat BOT that can answer questions based on the conversation, files and calendar events.
    Use the file contents if relevant to ANSWER the user's LATEST prompt.
    Some files may be labeled as auto-retrieved background context rather than explicitly attached by the user — use them only if relevant, and don't assume the user has seen them.
  # Header put before the files found by RAG.
  rag_header: |-
    --- Auto-retrieved background context (not explicitly attached by the user) ---

# File summary and keywords. Placeholders: {input} file content.
summarize:
  keywords: |
    ! FILE CONTENT START !
    {input}
    ! FILE CONTENT END !

    ! TASK !
    You are an expert summarizer.

    Extract **5 to 10 relevant keywords** that capture the **main topics and themes** of the file content above.

    ! FORMAT !
    Respond ONLY with a plain comma-separated list.
    Do NOT use JSON, code blocks, quotes, or formatting.
    Example: keyword1, keyword2, keyword3, ...
  summary: |
    ! FILE CONTENT START !
    {input}
    ! FILE CONTENT END !

    ! TASK !
    You are an expert summarizer.

    Write a **summary** from the CONTENT of the file above. Maximum of **200 WORDS**. Focus on the main ideas and key points. Use clear and concise language.

    ! FORMAT !
    Respond ONLY with plain markdown.
    Do NOT include explanations, notes, or any formatting outside the summary itself.

# Document tree (sections of a long document, recursive).
tree:
  # Placeholders: {start} {end} block range, {input} numbered blocks,
  # {context} context_line or empty, {count_rule} fixed/auto count rule,
  # {stop_rule} auto_stop_rule or empty, {focus} focus_line or empty.
  sections: |
    ! DOCUMENT PART START (blocks {start} to {end}) !
    {input}
    ! DOCUMENT PART END !

    ! TASK !
    You are an expert at analyzing scientific papers and long documents.
    Each paragraph block above starts with its number in brackets, like [12].
    {context}{count_rule} Follow its logical structure: existing headings first, otherwise clear shifts of idea.
    {stop_rule}For each section give:
    - "title": short title, maximum 10 words
    - "description": what the section says, maximum 3 short lines (50 words)
    - "start": number of the first block of the section
    - "end": number of the last block of the section
    Sections must be in document order, must not overlap and must together cover blocks {start} to {end}.
    {focus}
    ! FORMAT !
    Respond ONLY with a JSON array. No code fence, no comments, no text outside the JSON.
    Example: [{"title": "Introduction", "description": "Motivates the problem.", "start": {start}, "end": {start}}]
  # Placeholders: {path} ancestor section titles joined by " > ".
  context_line: |
    This part is the section "{path}" of a larger document.
  # Placeholders: {focus} reader focus typed by the user.
  focus_line: |
    Reader focus (use it to choose titles and descriptions): {focus}
  # Placeholders: {min_sections} {max_sections}.
  fixed_count_rule: |-
    Split this document part into {min_sections} to {max_sections} consecutive sections.
  # Placeholders: {max_sections}.
  auto_count_rule: |-
    Split this document part into consecutive sections, one per distinct idea, argument or step: as many as the ideas require, never padded or merged to reach a number (at most {max_sections}).
  auto_stop_rule: |
    If this part develops one single idea that splitting would only fragment, respond with an empty JSON array [].

# Vision LLM on images (OCR settings).
ocr:
  caption: |-
    Describe this image in one or two concise sentences.
  text: |-
    Extract all text visible in this image. Return only the raw text, preserving line breaks.

# AI paper search: OpenAlex queries.
research:
  # Placeholders: {intro} intro_description or intro_papers, {context} research description or paper list,
  # {max_queries} query limit.
  queries: |-
    You help a researcher find recently published scientific papers.
    {intro}

    <context>
    {context}
    </context>

    Write between 3 and {max_queries} search queries for the OpenAlex full-text search
    (it matches words in titles, abstracts and full texts). Each query covers one distinct
    angle of the research. Query syntax:
    - "exact phrase" in double quotes
    - OR between synonyms, AND between the 2-3 concepts that must all appear, NOT to exclude
    - parentheses to group, operators in UPPERCASE, no wildcards
    Keep each query focused: too broad floods the results, too many AND finds nothing.

    Answer ONLY with a JSON array of strings, no explanation. Example:
    ["(\"large language model\" OR LLM) AND (retrieval OR RAG)", "\"protein folding\" AND \"deep learning\""]
  intro_description: |-
    The researcher describes their research as follows:
  intro_papers: |-
    The researcher's library contains these papers (title, year):

# Auto-find links between files.
link:
  # Placeholders: {source_description} file_with_summary/file_without_summary of the source,
  # {targets} one "- " + file description per target, {source} source path.
  relations: |-
    You are a document analysis assistant. Assess how semantically related each target file is to the source file.

    Source file:
    {source_description}

    Target files:
    {targets}

    For each target file that has a genuine semantic relationship with the source file, output one JSON object.
    Score force based on the strength of the relationship (shared topic, methodology, data, citations, etc.).
    Include all targets, even if the relationship is weak or nonexistent (force=0). If no relationship, set force to 0 and comment to "No relation".

    Rules:
    - Set "force" between 0 (weak) and 3.0 (strong).
    - Write a short "comment" explaining the link (max 20 words).
    - Always use "{source}" as "fileA" and the target path as "fileB".
    - Output ONLY a valid JSON array, no explanation, no markdown, no code block.

    Output format:
    [
      {"fileA": "{source}", "fileB": "<target_path>", "force": <float>, "comment": "<short explanation>"},
      ...
    ]

    If no target files are related to the source file, output an empty array: []
  # Placeholders: {name} file name, {path} file path, {summary} {keywords}.
  file_with_summary: |-
    File: {name}
    Path: {path}
    Keywords: {keywords}
    Summary: {summary}
  # Placeholders: {name} file name, {path} file path.
  file_without_summary: |-
    File: {name}
    Path: {path}
    (No summary available)

# AI buttons under text areas (rewrite).
refractor:
  # Placeholders: {question} instruction typed by the user or default_question, {text} text to rewrite.
  rewrite: |-
    Respond ONLY with the text in the LANGUAGE of the text. {question}

    {text}
  default_question: |-
    Improve this text:

# Mail client assistant.
mail:
  # Triage of one email. Placeholders: {sender} {date} {subject} {body}.
  summary: |-
    Read this email and help its recipient triage it.

    <email>
    From: {sender}
    Date: {date}
    Subject: {subject}

    {body}
    </email>

    Answer ONLY with a JSON object, no explanation:
    {"summary": "2-3 sentence summary of what the email says and asks",
      "needs_reply": true or false (does the sender expect an answer from the recipient?),
      "action": "the one concrete next step for the recipient, or empty string"}
  # Briefing of unread emails. Placeholders: {emails} one digest_entry per email.
  digest: |-
    Write a short briefing of these unread emails for their recipient.
    Group them by what to do: "Reply", "Read", "Ignore". One bullet per email:
    **sender** – subject: one-line gist. Markdown only, no preamble.

    <emails>
    {emails}
    </emails>
  # Placeholders: {sender} {subject} {body} (whitespace collapsed, truncated).
  digest_entry: |-
    - From: {sender} | Subject: {subject}
      {body}
  # Reply draft. Placeholders: {note} reply_sender_note or empty, {instruction} recipient
  # instruction or reply_default_instruction, {sender} {subject} {body}.
  reply: |-
    Write a reply to this email on behalf of its recipient.
    {note}
    Instructions from the recipient: {instruction}
    Reply in the language of the email. Write ONLY the reply body (greeting to sign-off),
    no subject line, no quoted original, no placeholder in brackets unless information is missing.

    <email>
    From: {sender}
    Subject: {subject}

    {body}
    </email>
  # Placeholders: {note} what the recipient noted about the sender.
  reply_sender_note: |
    About the sender: {note}
  reply_default_instruction: |-
    Answer briefly and politely.
  # Mail Preview (short title + summary in lists).
  # Placeholders: {sender} {subject} {body} {title_words} {summary_words}.
  preview: |-
    Write a Mail Preview of this email for its recipient's inbox list.

    <email>
    From: {sender}
    Subject: {subject}

    {body}
    </email>

    Answer ONLY with a JSON object, no explanation, in the language of the email:
    {"title": "what the email is about, at most {title_words} words",
      "summary": "the gist and what is expected, at most {summary_words} words"}

# Activity generation: one call per day for the journal summary and the time entries.
activity:
  # Placeholders: {day} "YYYY-MM-DD".
  day_start: |-
    ! ACTIVITY OF {day} START !
  day_end: |-
    ! ACTIVITY OF {day} END !
  # Placeholders: {catalog} "Projects:" and "Tags:" bullet lists.
  catalog: |-
    ! PROJECTS AND TAGS !
    {catalog}
  # Placeholders: {tasks} asked *_task blocks, {formats} asked *_format blocks.
  task: |-
    ! TASK !
    Times above are local. Do every task below.

    {tasks}

    ! FORMAT !
    Respond ONLY with these sections, in this order, each starting with its marker line:
    {formats}
  summary_task: |-
    SUMMARY: write the end-of-day journal of the user from the activity above.
    Group related items, name projects, people and outcomes, skip noise.
    Sections: a 2-3 sentence overview, then "## Highlights" (bullets), then "## Details" per theme.
    Maximum 400 words.
  time_task: |-
    TIME ENTRIES: turn the activity above into the time entries of the user's day.
    Be detailed: one block per distinct task (feature, bug, meeting, review, mail thread, writing),
    split a long period when the work changes; merge only items of the same task; minimum 15 minutes.
    Title names the concrete task; description gives 1-3 sentences of specifics
    (files, repos, PRs, documents, people, decisions, outcomes) taken from the activity.
    Build a complete working day from the first to the last activity:
    fill every gap between blocks by extending the neighbouring block of the most related task,
    or by a block for the likely work in between (inferred from the activity before and after).
    Never cover meal breaks 12:00-13:00 and 19:00-20:00 (shift them by up to 30 minutes
    when a meeting or activity overlaps them), unless the activity shows work there.
    Blocks must not overlap. Give each block the projects and tags it belongs to,
    chosen ONLY from the lists above (exact names, several allowed, empty list when none fits).
  # Placeholders: {marker} answer marker line (parsed back by the backend, keep it).
  summary_format: |-
    {marker}
    markdown, no title line, no code fence
  time_format: |-
    {marker}
    JSON array only, no code fence:
    [{"start": "HH:MM", "end": "HH:MM", "title": "concrete task", "description": "1-3 sentences of specifics",
      "projects": ["Project name"], "tags": ["Tag name"]}]
